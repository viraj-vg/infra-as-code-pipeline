name: continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: code checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: run tests
        run: python -m pytest -q

  terraform-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: code checkout
        uses: actions/checkout@v4

      - name: setup terraform
        uses: hashicorp/setup-terraform@v3

      - name: format check
        run: terraform fmt -check -recursive

      - name: terraform init without backend
        run: terraform init -backend=false
        working-directory: terraform/capstone3-tf

      - name: terraform validate
        run: terraform validate
        working-directory: terraform/capstone3-tf

      - name: setup tflint
        uses: terraform-linters/setup-tflint@v4

      - name: tflint
        run: tflint --recursive

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v4

      - name: build backend image
        run: docker build -t clouddeploy-backend:ci ./backend

      - name: build frontend image
        run: docker build -t clouddeploy-frontend:ci ./frontend

  push-staging:
    if: github.event_name == 'pull_request'
    needs: 
    - backend-tests 
    - terraform-checks 
    - docker-build
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: code checkout
        uses: actions/checkout@v4

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: login to ecr
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: build and push images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          for name in backend frontend; do
            repo="staging-clouddeploy-${name}"
            if aws ecr describe-images --repository-name "$repo" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
              echo "$repo:$TAG already exists. Skipping."
              continue
            fi
            docker build -t "$REGISTRY/$repo:$TAG" "./$name"
            docker push "$REGISTRY/$repo:$TAG"
          done
