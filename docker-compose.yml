services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    restart: unless-stopped
    volumes:
      - clouddeploy_data:/data
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
   
    restart: unless-stopped
    networks:
      - app_network

volumes:
  clouddeploy_data:

networks:
  app_network:
    driver: bridge

